<!doctype html>
<!-- Image d'attente de la vidéo de présentation (1920 × 1080), rendue par scripts/site-seo.py avec Chrome
     sans fenêtre, affichée tant que la vidéo ne joue pas (et à sa place avec « Réduire les animations »).
     Logo et symbole seulement : l'état de lecture et la durée sont écrits par la page. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: "Archivo"; src: url("../../site/fonts/Archivo-wdth-wght.woff2") format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Martian Mono"; src: url("../../site/fonts/MartianMono-wdth-wght.woff2") format("woff2"); font-weight: 100 800; font-stretch: 75% 112.5%; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: #090D12; }
body { position: relative; font-family: "Archivo", sans-serif; color: #E3EDF0; -webkit-font-smoothing: antialiased; }
.bg { position: absolute; inset: 0;
  background:
    radial-gradient(900px 700px at 960px 600px, rgb(109 91 255 / .28), transparent 70%),
    linear-gradient(rgb(227 237 240 / .03) 1px, transparent 1px) 0 0 / 64px 64px,
    linear-gradient(90deg, rgb(227 237 240 / .03) 1px, transparent 1px) 0 0 / 64px 64px,
    #090D12; }
.mark { position: absolute; left: 760px; top: 300px; width: 400px; height: 400px; }
.logo { position: absolute; left: 96px; top: 80px; height: 36px; width: auto; }
</style>
</head>
<body>
<div class="bg"></div>
<img class="logo" src="../../site/assets/img/kybernow-logo-dark.svg" alt="">
<img class="mark" src="../../site/assets/img/kybernow-mark-now-lit-dark.svg" alt="">
</body>
</html>
