[package]
name = "kybernow-tray"
version = "0.9.7"
edition = "2024"
rust-version = "1.89"
description = "Icône de KyberNow Station dans la zone de notification de Windows"
license = "AGPL-3.0-or-later"
authors = ["Les Lignes Claires"]

[dependencies]
anyhow = "1.0.104"
qrcodegen = "1.8"
serde_json = "1.0.154"

# Station Mac : seulement le mode console d'un prêt (`kybernow-console --console`).
[target.'cfg(target_os = "macos")'.dependencies]
tao = "0.37.1"
wry = "0.57.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSDate", "NSGeometry", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace", "NSWindow", "NSView", "NSScreen", "NSGraphics"] }

[target."cfg(windows)".dependencies]
png = "0.18"
tao = "0.37.1"
tray-icon = "0.21"
wry = "0.57.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
