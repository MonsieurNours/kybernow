<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>KyberNow Share</title>
<style>
@font-face { font-family: 'Archivo'; src: url('/fonts/archivo.woff2') format('woff2'); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: 'Martian Mono'; src: url('/fonts/martian.woff2') format('woff2'); font-weight: 100 800; font-stretch: 75% 112.5%; }
:root {
  --bg: #05070A; --text: #E3EDF0; --text-2: #C9D3DC; --faint: #8A99A3;
  --signal: #9A8CFF; --signal-strong: #6D5BFF; --signal-light: #D4CEFF; --warn: #F5B841;
  color-scheme: dark;
}
* { box-sizing: border-box; }
/* Du 720p au 4K : tout suit la taille de l'écran de l'ami. */
html { font-size: clamp(14px, calc(0.9vw + 0.5vh), 34px); }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; background: radial-gradient(70% 90% at 88% -10%, rgba(109,91,255,.22), rgba(109,91,255,0) 60%), var(--bg); color: var(--text); font: 1rem/1.4 'Archivo', 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; user-select: none; cursor: default; }
button { font: inherit; color: inherit; cursor: pointer; }
.lbl { font-family: 'Martian Mono', Consolas, monospace; font-size: .68rem; letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }

header { display: flex; justify-content: space-between; align-items: center; gap: 2rem; padding: 2.4rem 3.2rem 1.2rem; }
header img { height: 2.3rem; display: block; }
.time { display: flex; flex-direction: column; align-items: flex-end; gap: .2rem; text-align: right; }
.time strong { font-stretch: 125%; font-size: 1.55rem; font-weight: 650; letter-spacing: -.02em; }

.notice { margin: 0 3.2rem; padding: .9rem 1.2rem; border-radius: .8rem; background: rgba(245,184,65,.12); box-shadow: inset 0 0 0 1px rgba(245,184,65,.45); color: #F8E2B0; font-size: 1.05rem; }
.notice[hidden] { display: none; }

main { flex: 1; overflow: hidden auto; padding: 2rem 3.2rem; display: grid; grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr)); gap: 1.4rem; align-content: start; }
.tile { aspect-ratio: 1; border: 0; border-radius: 1.1rem; padding: 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .9rem; background: rgba(255,255,255,.045); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); transition: transform .12s, background-color .12s, box-shadow .12s; }
.tile img, .tile .glyph { width: 46%; aspect-ratio: 1; object-fit: contain; display: grid; place-items: center; }
.tile .glyph { border-radius: 22%; background: rgba(109,91,255,.16); color: var(--signal-light); font-stretch: 125%; font-weight: 650; font-size: 2.2rem; }
.tile .glyph svg { width: 62%; height: 62%; }
.tile span { max-width: 100%; text-align: center; font-size: 1rem; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.tile:focus { outline: none; transform: scale(1.045); background: rgba(109,91,255,.18); box-shadow: inset 0 0 0 2px var(--signal), 0 0 0 .3rem rgba(154,140,255,.22), 0 0 2rem rgba(109,91,255,.35); }
.empty { grid-column: 1 / -1; color: var(--faint); font-size: 1.1rem; }

footer { display: flex; justify-content: space-between; align-items: center; gap: 2rem; padding: 1rem 3.2rem 2.2rem; }
.status { color: var(--text-2); min-height: 1.4rem; }
.giveback, .dialog button { height: 2.9rem; padding: 0 1.5rem; border: 0; border-radius: .8rem; font-weight: 600; }
.giveback { background: rgba(255,107,107,.12); box-shadow: inset 0 0 0 1px rgba(255,107,107,.4); color: #FFC9C4; }
.giveback:focus, .dialog button:focus { outline: .15rem solid var(--signal); outline-offset: .2rem; }

.overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5,7,10,.78); }
.overlay[hidden] { display: none; }
.dialog { width: min(32rem, 90vw); padding: 2rem; border-radius: 1.2rem; background: #0C1016; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1), 0 1.5rem 4rem rgba(0,0,0,.6); display: flex; flex-direction: column; gap: 1.6rem; }
.dialog p { margin: 0; font-stretch: 112%; font-size: 1.35rem; font-weight: 600; line-height: 1.3; }
.dialog .row { display: flex; gap: .8rem; justify-content: flex-end; }
.dialog .yes { background: rgba(255,107,107,.16); box-shadow: inset 0 0 0 1px rgba(255,107,107,.45); color: #FFC9C4; }
.dialog .no { background: none; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <img src="/logo.svg" alt="KyberNow Share">
  <div class="time"><span class="lbl" id="lentBy"></span><strong id="left"></strong></div>
</header>
<div class="notice" id="notice" role="status" hidden></div>
<main id="tiles"></main>
<footer>
  <span class="status" id="status" role="status"></span>
  <button class="giveback" id="giveback" data-nav></button>
</footer>
<div class="overlay" id="confirm" hidden>
  <div class="dialog" role="alertdialog" aria-labelledby="confirmText">
    <p id="confirmText"></p>
    <div class="row"><button class="no" id="no" data-nav></button><button class="yes" id="yes" data-nav></button></div>
  </div>
</div>
<script>
// Lanceur du prêt (KyberNow Share) sur l'écran de l'ami. L'agent pousse les tuiles
// (window.__knTiles), les textes (window.__knTexts) et les manettes (window.__knPad) ;
// la page envoie « launch » et « giveBack » par window.ipc.postMessage.
const send = (cmd, extra) => window.ipc && window.ipc.postMessage(JSON.stringify({ cmd, ...extra }))
const $ = (id) => document.getElementById(id)
const esc = (t) => String(t ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c])
const PAD = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 7h9a5 5 0 0 1 4.9 6l-.8 3.9a2.3 2.3 0 0 1-3.9 1.1L14.6 16H9.4l-2.1 2a2.3 2.3 0 0 1-3.9-1.1L2.6 13A5 5 0 0 1 7.5 7zM7 10.5v3M5.5 12h3M15.5 11h.01M17.5 13h.01"/></svg>'
let texts = {}
let tiles = []
const confirming = () => !$('confirm').hidden

function renderTiles() {
  const keep = document.activeElement && document.activeElement.dataset.id
  const before = document.querySelectorAll('.tile').length
  $('tiles').innerHTML = tiles.length
    ? tiles.map((t) => `<button class="tile" data-nav data-id="${esc(t.id)}">${t.icon ? `<img src="${esc(t.icon)}" alt="">` : `<span class="glyph">${t.id === 'steam' ? PAD : esc((t.name || '?').trim().charAt(0).toUpperCase())}</span>`}<span>${esc(t.name)}</span></button>`).join('')
    : `<p class="empty">${esc(texts.noApps || '')}</p>`
  // La tuile qui avait le focus le garde ; les premières tuiles arrivées, la première l'a.
  const again = keep && [...document.querySelectorAll('.tile')].find((b) => b.dataset.id === keep)
  if (confirming()) return
  if (again) again.focus()
  else if (!before || !items().includes(document.activeElement)) first().focus()
}

function renderTexts() {
  document.documentElement.lang = texts.lang || 'fr'
  $('lentBy').textContent = texts.lentBy || ''
  $('left').textContent = texts.left || ''
  $('notice').textContent = texts.notice || ''
  $('notice').hidden = !texts.notice
  $('status').textContent = texts.opening || ''
  $('giveback').textContent = texts.giveBack || ''
  $('confirmText').textContent = texts.confirm || ''
  $('yes').textContent = texts.giveBack || ''
  $('no').textContent = texts.cancel || ''
  if (!tiles.length) renderTiles()
}

const items = () => [...document.querySelectorAll(confirming() ? '#confirm [data-nav]' : 'main [data-nav], footer [data-nav]')]
const first = () => items()[0] || $('giveback')

// Navigation à la croix ou aux flèches : l'élément le plus proche dans la direction.
function move(dir) {
  const list = items()
  const cur = list.includes(document.activeElement) ? document.activeElement : null
  if (!cur) { first().focus(); return }
  const a = cur.getBoundingClientRect()
  const ax = a.left + a.width / 2, ay = a.top + a.height / 2
  const across = dir === 'left' || dir === 'right'
  let best = null, score = Infinity
  for (const el of list) {
    if (el === cur) continue
    const b = el.getBoundingClientRect()
    const dx = b.left + b.width / 2 - ax, dy = b.top + b.height / 2 - ay
    const ok = dir === 'left' ? dx < -1 : dir === 'right' ? dx > 1 : dir === 'up' ? dy < -1 : dy > 1
    if (!ok) continue
    const s = (across ? Math.abs(dx) : Math.abs(dy)) + 2 * (across ? Math.abs(dy) : Math.abs(dx))
    if (s < score) { best = el; score = s }
  }
  if (best) { best.focus(); best.scrollIntoView({ block: 'nearest' }) }
}

function openConfirm() { $('confirm').hidden = false; $('no').focus() }
function closeConfirm() { $('confirm').hidden = true; $('giveback').focus() }

function activate(el) {
  if (!el) return
  if (el.dataset.id) send('launch', { id: el.dataset.id })
  else if (el.id === 'giveback') openConfirm()
  else if (el.id === 'yes') { $('confirm').hidden = true; send('giveBack') }
  else if (el.id === 'no') closeConfirm()
}

document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-nav]')
  if (el) activate(el)
})
document.addEventListener('mousemove', (e) => {
  const el = e.target.closest('[data-nav]')
  if (el && el !== document.activeElement && items().includes(el)) el.focus()
})
document.addEventListener('keydown', (e) => {
  const dirs = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right' }
  if (dirs[e.key]) { e.preventDefault(); move(dirs[e.key]); return }
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault()
    if (items().includes(document.activeElement)) activate(document.activeElement)
    else first().focus()
    return
  }
  if (e.key === 'Escape' && confirming()) { e.preventDefault(); closeConfirm() }
})
document.addEventListener('contextmenu', (e) => e.preventDefault())
// Les clics ne laissent jamais le focus nulle part (la manette en a besoin).
document.addEventListener('focusout', () => setTimeout(() => { if (!items().includes(document.activeElement)) first().focus() }, 0))

window.__knTiles = (list) => { tiles = list || []; renderTiles() }
window.__knTexts = (t) => { texts = t || {}; renderTexts() }
window.__knPad = (action) => {
  if (action === 'a') { activate(items().includes(document.activeElement) ? document.activeElement : first()) ; return }
  if (action === 'b') { if (confirming()) closeConfirm(); return }
  move(action)
}
send('ready')
</script>
</body>
</html>
