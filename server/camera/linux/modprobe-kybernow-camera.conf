# KyberNow Station : la caméra de l'appareil (docs/webcam.md, « Station Linux »).
# Un périphérique v4l2loopback nommé « KyberNow Camera », vu comme une caméra
# seulement quand la Station y écrit (exclusive_caps) : Zoom, Discord et les
# navigateurs ne le proposent pas pour rien. Installé par le paquet dans
# /usr/lib/modprobe.d/kybernow-camera.conf ; un fichier du même nom dans
# /etc/modprobe.d/ le remplace.
#
# devices=1 vaut pour tout le système : la caméra virtuelle d'OBS, qui
# trouve le module déjà chargé, prend ce même périphérique s'il est libre.
# Les deux ne servent pas en même temps (docs/webcam.md, « Station Linux »).
options v4l2loopback devices=1 card_label="KyberNow Camera" exclusive_caps=1 max_buffers=2
