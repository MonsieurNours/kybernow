# KyberNow Station : la caméra de l'appareil (docs/webcam.md, « Station Linux »).
# Un périphérique v4l2loopback nommé « KyberNow Camera », vu comme une caméra
# seulement quand la Station y écrit (exclusive_caps) : Zoom, Discord et les
# navigateurs ne le proposent pas pour rien. Installé dans /etc/modprobe.d/.
options v4l2loopback devices=1 card_label="KyberNow Camera" exclusive_caps=1 max_buffers=2
