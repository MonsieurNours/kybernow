[package]
name = "kyber-admin"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Service d'administration web pour un serveur Kyber"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
axum = "0.8"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
hostname = "0.4.2"
mime_guess = "2.0.5"
nvml-wrapper = "0.13.0"
rand = "0.9"
rcgen = "0.13"
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
