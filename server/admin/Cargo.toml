[package]
name = "kyber-admin"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Service d'administration web pour un serveur Kyber"
license = "AGPL-3.0-or-later"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5"
axum = "0.8"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
hostname = "0.4.2"
mdns-sd = "0.21.6"
mime_guess = "2.0.5"
nvml-wrapper = "0.13.0"
rand = "0.9"
rcgen = "0.13"
rust-embed = { version = "8.13.0", features = ["include-exclude"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.3", features = ["full"] }
toml = "1.1.8"
toml_edit = "0.25.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
urlencoding = "2.1.3"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
windows-core = "0.62"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Devices_Properties"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Environment", "Win32_System_IO", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
