[package]
name = "kybernow-tunnel"
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
description = "Tunnel du relais de KyberNow : messages, trames, identifiants, transports QUIC et TLS/yamux, flux UDP"

# Pris par le relais, par Admin et par le cœur des apps, qui compile aussi
# pour iOS, Android et webOS : dépendances légères et portables, rustls avec
# ring, pas d'OpenSSL.
[features]
default = ["client"]
# Tunnel des apps : points d'écoute locaux vers Admin et Kyber.
client = []
# Agent de la Station : identité Ed25519, certificat client, flux servis.
station = ["dep:rcgen"]
# Pièces du relais : certificat client facultatif, contrôle de congestion
# choisi après la négociation.
server = ["dep:quinn-proto"]

[dependencies]
base64 = "0.22"
bytes = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
log = "0.4"
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
quinn-proto = { version = "0.11", optional = true, default-features = false }
rcgen = { version = "0.13", optional = true, default-features = false, features = ["ring", "pem"] }
ring = "0.17"
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.43", features = ["rt", "net", "sync", "time", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["compat"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["ring", "std"] }
webpki-roots = "1"
yamux = "0.13"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "time", "io-util", "net"] }

[[test]]
name = "boucle_locale"
required-features = ["client", "station", "server"]
