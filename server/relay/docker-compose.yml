# Relais de KyberNow (README.md) : le relais (image publiée à chaque version de
# KyberNow sur ghcr.io), lego, qui obtient et renouvelle le certificat
# `<domaine>` + `*.<domaine>` (DNS-01 chez Gandi), et updater, qui reprend
# chaque nuit la dernière image du relais.
#   cp .env.example .env   # puis le remplir
#   docker compose up -d
# Construire l'image ici depuis les sources plutôt que la télécharger
# (RELAY_IMAGE=kybernow-relay:local dans .env : la mise à jour de la nuit ne
# l'écrase pas, voir update.sh) :
#   docker compose build relay && docker compose up -d

name: kybernow-relay

services:
  relay:
    # Construction avec le réseau de la machine : derrière un DNS local
    # (Pi-hole, unbound sur 127.0.0.1), le réseau de construction de Docker ne
    # résout pas les noms (crates.io).
    build:
      context: .
      network: host
    image: ${RELAY_IMAGE:-ghcr.io/monsieurnours/kybernow-relay:latest}
    restart: unless-stopped
    # Le port d'écoute (8443 par défaut) en TCP et en UDP, sans traduction
    # d'adresse par Docker (les adresses des clients restent les vraies). La
    # box renvoie le port public vers lui (README.md, « Les ports et la box »).
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      KN_RELAY_DOMAIN: ${RELAY_DOMAIN:?RELAY_DOMAIN manque dans .env}
      KN_RELAY_LISTEN: ${RELAY_LISTEN:-0.0.0.0:8443}
      # Port public annoncé dans les liens et les adresses des Stations
      # (vide : le port d'écoute ; 443 : sans port).
      KN_RELAY_PUBLIC_PORT: ${RELAY_PUBLIC_PORT:-}
      # Navigateur chiffré de bout en bout (docs/relais.md) : la zone dont le TLS passe tel quel
      # jusqu'aux Stations (vide : station.<domaine> ; off : coupé ; au port public 443 seulement).
      KN_RELAY_TLS_ZONE: ${RELAY_TLS_ZONE:-}
      KN_RELAY_METRICS: ${RELAY_METRICS:-127.0.0.1:9464}
      KN_RELAY_BANLIST: /config/banlist.txt
      # Comptes KyberNow (README.md, « Comptes ») : on ou off ; vide, relay.toml décide.
      KN_RELAY_ACCOUNTS: ${RELAY_ACCOUNTS:-}
      # E-mails des comptes (README.md, « Comptes ») : sans SMTP_HOST, aucun
      # e-mail. Le mot de passe est dans secrets/smtp_password (lisible par
      # l'utilisateur 65532 de l'image : chmod 644, le dossier secrets/ reste en 700).
      KN_RELAY_SMTP_HOST: ${SMTP_HOST:-}
      KN_RELAY_SMTP_PORT: ${SMTP_PORT:-}
      KN_RELAY_SMTP_STARTTLS: ${SMTP_STARTTLS:-}
      KN_RELAY_SMTP_USER: ${SMTP_USER:-}
      KN_RELAY_SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      KN_RELAY_SMTP_FROM: ${SMTP_FROM:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./certs:/certs:ro
      - ./config:/config:ro
      # La base des comptes et sa clé (en écriture, à l'utilisateur 65532 de l'image).
      - ./data:/data
    secrets:
      - smtp_password
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  lego:
    image: goacme/lego:v4.29.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/lego.sh"]
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?RELAY_DOMAIN manque dans .env}
      LEGO_EMAIL: ${LEGO_EMAIL:?LEGO_EMAIL manque dans .env}
      # Serveur de test de Let's Encrypt par défaut (voir README.md).
      LEGO_SERVER: ${LEGO_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
      LEGO_ACCEPT_TOS: ${LEGO_ACCEPT_TOS:-no}
      GANDIV5_PERSONAL_ACCESS_TOKEN_FILE: /run/secrets/gandi_pat
    secrets:
      - gandi_pat
    volumes:
      - ./certs:/certs
      - ./lego.sh:/scripts/lego.sh:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Mise à jour du relais : chaque nuit (RELAY_UPDATE_HOUR, 4 h par défaut, heure
  # du conteneur, UTC), `docker compose pull relay` puis `up -d relay` : le relais
  # ne redémarre que si l'image a changé. RELAY_AUTO_UPDATE=no le coupe. Une
  # image épinglée (…@sha256:…) ou construite ici n'est jamais remplacée ; avec
  # RELAY_COSIGN_KEY, seule une image signée l'est. Ce service a la main sur
  # Docker (docker.sock, l'équivalent de root) : sans signature, épinglez
  # l'image et coupez-le (README.md, « Mettre à jour »). Il voit
  # ce dossier au même chemin que la machine (les chemins ./certs, ./config du
  # compose restent justes) : lancer docker compose depuis ce dossier.
  updater:
    image: docker:27.5.1-cli
    restart: unless-stopped
    entrypoint: ["/bin/sh", "${PWD}/update.sh"]
    working_dir: ${PWD}
    environment:
      RELAY_UPDATE_HOUR: ${RELAY_UPDATE_HOUR:-4}
      RELAY_AUTO_UPDATE: ${RELAY_AUTO_UPDATE:-yes}
      RELAY_IMAGE: ${RELAY_IMAGE:-ghcr.io/monsieurnours/kybernow-relay:latest}
      # Clé publique cosign (chemin dans ce dossier) : la nouvelle image n'est prise que signée.
      RELAY_COSIGN_KEY: ${RELAY_COSIGN_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

secrets:
  gandi_pat:
    file: ./secrets/gandi_pat
  # Vide sans SMTP (touch secrets/smtp_password).
  smtp_password:
    file: ./secrets/smtp_password
