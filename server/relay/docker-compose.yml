# Relais de KyberNow (README.md) : le relais (image publiée à chaque version de
# KyberNow sur ghcr.io), lego, qui obtient et renouvelle le certificat
# `<domaine>` + `*.<domaine>` (DNS-01 chez Gandi), et updater, qui reprend
# chaque nuit la dernière image du relais.
#   cp .env.example .env   # puis le remplir
#   docker compose up -d
# Construire l'image ici depuis les sources plutôt que la télécharger :
#   docker compose build relay && docker compose up -d

name: kybernow-relay

services:
  relay:
    # Construction avec le réseau de la machine : derrière un DNS local
    # (Pi-hole, unbound sur 127.0.0.1), le réseau de construction de Docker ne
    # résout pas les noms (crates.io).
    build:
      context: .
      network: host
    image: ${RELAY_IMAGE:-ghcr.io/monsieurnours/kybernow-relay:latest}
    restart: unless-stopped
    # Le port d'écoute (8443 par défaut) en TCP et en UDP, sans traduction
    # d'adresse par Docker (les adresses des clients restent les vraies). La
    # box renvoie le port public vers lui (README.md, « Les ports et la box »).
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    environment:
      KN_RELAY_DOMAIN: ${RELAY_DOMAIN:?RELAY_DOMAIN manque dans .env}
      KN_RELAY_LISTEN: ${RELAY_LISTEN:-0.0.0.0:8443}
      # Port public annoncé dans les liens et les adresses des Stations
      # (vide : le port d'écoute ; 443 : sans port).
      KN_RELAY_PUBLIC_PORT: ${RELAY_PUBLIC_PORT:-}
      KN_RELAY_METRICS: ${RELAY_METRICS:-127.0.0.1:9464}
      KN_RELAY_BANLIST: /config/banlist.txt
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./certs:/certs:ro
      - ./config:/config:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  lego:
    image: goacme/lego:v4.29.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/lego.sh"]
    environment:
      RELAY_DOMAIN: ${RELAY_DOMAIN:?RELAY_DOMAIN manque dans .env}
      LEGO_EMAIL: ${LEGO_EMAIL:?LEGO_EMAIL manque dans .env}
      # Serveur de test de Let's Encrypt par défaut (voir README.md).
      LEGO_SERVER: ${LEGO_SERVER:-https://acme-staging-v02.api.letsencrypt.org/directory}
      LEGO_ACCEPT_TOS: ${LEGO_ACCEPT_TOS:-no}
      GANDIV5_PERSONAL_ACCESS_TOKEN_FILE: /run/secrets/gandi_pat
    secrets:
      - gandi_pat
    volumes:
      - ./certs:/certs
      - ./lego.sh:/scripts/lego.sh:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  # Mise à jour du relais : chaque nuit (RELAY_UPDATE_HOUR, 4 h par défaut, heure
  # du conteneur, UTC), `docker compose pull relay` puis `up -d relay` : le relais
  # ne redémarre que si l'image a changé. RELAY_AUTO_UPDATE=no le coupe. Il voit
  # ce dossier au même chemin que la machine (les chemins ./certs, ./config du
  # compose restent justes) : lancer docker compose depuis ce dossier.
  updater:
    image: docker:27.5.1-cli
    restart: unless-stopped
    entrypoint: ["/bin/sh", "${PWD}/update.sh"]
    working_dir: ${PWD}
    environment:
      RELAY_UPDATE_HOUR: ${RELAY_UPDATE_HOUR:-4}
      RELAY_AUTO_UPDATE: ${RELAY_AUTO_UPDATE:-yes}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

secrets:
  gandi_pat:
    file: ./secrets/gandi_pat
