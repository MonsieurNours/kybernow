# Relais de KyberNow (docs/relais.md) : le serveur relais (ce paquet) et le
# crate commun du tunnel (tunnel/), partagé par le relais, Admin
# (server/admin) et le cœur des apps (apps/core), qui le prennent par chemin.

[workspace]
resolver = "3"
members = [".", "tunnel"]

[package]
name = "kybernow-relay"
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
description = "Relais de KyberNow : partage et accès à son ordinateur hors de chez soi"

[dependencies]
kybernow-tunnel = { path = "tunnel", default-features = false, features = ["server"] }
anyhow = "1"
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1.6", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.10", features = ["tokio"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
ring = "0.17"
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.5"
tokio = { version = "1.43", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
yamux = "0.13"

[dev-dependencies]
kybernow-tunnel = { path = "tunnel", features = ["client", "station", "server"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[profile.release]
strip = true
lto = "thin"
