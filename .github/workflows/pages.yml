# Publie le site www.kybernow.app (dossier site/) sur GitHub Pages.
# Domaine personnalisé : réglé dans Settings › Pages (aucun fichier CNAME nécessaire avec un workflow).
name: Site

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Deux jobs, comme le modèle de GitHub : l'archive du site est préparée, puis
# publiée par un job à part. Dans un seul job, la publication ne trouvait pas
# l'archive qu'elle venait de recevoir (« Found 0 artifact(s) », depuis le 25/11/2026).
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
