# Essais du cœur Rust des apps KyberNow Link (apps/core), à chaque push et
# pull request vers main qui le touche (COEUR-49, audit du 27/11/2026).
#
# Le cœur compile contre les sources de Kyber 0.29, avec les correctifs
# KyberNow des apps : apps/core/scripts/ci-essais.sh les clone depuis
# gitlab.com/kyber, pose les correctifs, construit libkynput et une libvlc
# factice (kyvlcplayer lie la libvlc 4 de Kyber, que les essais n'appellent
# jamais), puis lance cargo test -p kybernow-core --features pyrowave --lib.
#
# Ce que ce job ne couvre pas : les ponts (apps/apple, apps/android/jni), les
# apps elles-mêmes et le lecteur SDL (--features sdl), qui demandent les
# rootfs de Kyber construits sur le Mac de l'auteur.
name: Cœur

on:
  push:
    branches: [main]
    paths:
      - apps/core/**
      - apps/Cargo.toml
      - apps/Cargo.lock
      - apps/macos/kyber-patches/**
      - server/kyber-patches/**
      - server/relay/tunnel/**
      - scripts/kyber-client-patches.sh
      - .github/workflows/coeur.yml
  pull_request:
    branches: [main]
    paths:
      - apps/core/**
      - apps/Cargo.toml
      - apps/Cargo.lock
      - apps/macos/kyber-patches/**
      - server/kyber-patches/**
      - server/relay/tunnel/**
      - scripts/kyber-client-patches.sh
      - .github/workflows/coeur.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coeur-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  essais:
    name: Essais du cœur
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Paquets du système
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config clang libclang-dev libopus-dev libudev-dev libevdev-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-c
      # Sources de Kyber : la même étiquette tant que les correctifs ne
      # changent pas d'origine ; le cache évite de recloner à chaque fois.
      - uses: actions/cache@v4
        with:
          path: third_party/kyber-desktop
          key: kyber-desktop-0.29.0-v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps
          cache-directories: third_party/ci-rootfs
      - name: Essais
        run: apps/core/scripts/ci-essais.sh
