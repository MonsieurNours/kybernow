# Publie l'image Docker du relais de KyberNow (server/relay) sur GitHub
# Container Registry à chaque version : ghcr.io/monsieurnours/kybernow-relay,
# étiquetée X.Y.Z et, pour une version stable, latest. Les relais installés avec
# le docker-compose.yml du dépôt la reprennent d'eux-mêmes chaque nuit (service
# « updater ») ou par `docker compose pull && docker compose up -d`.
# Voir server/relay/README.md, « Mettre à jour ».
name: Image du relais

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (X.Y.Z, une étiquette vX.Y.Z existante)"
        required: true
      latest:
        description: "Étiqueter aussi latest"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-image
  cancel-in-progress: false

jobs:
  image:
    name: Construire et publier
    runs-on: ubuntu-latest
    steps:
      - name: Version
        id: v
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            latest="${{ github.event.release.prerelease == false }}"
          else
            tag="v${{ inputs.version }}"
            latest="${{ inputs.latest }}"
          fi
          version="${tag#v}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "version illisible : $tag" >&2; exit 1 ;;
          esac
          image="ghcr.io/monsieurnours/kybernow-relay"
          tags="$image:$version"
          [ "$latest" = "true" ] && tags="$tags,$image:latest"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.v.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server/relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.title=KyberNow relay
            org.opencontainers.image.description=Relais de KyberNow (KyberNow Share, accès hors de chez soi)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
