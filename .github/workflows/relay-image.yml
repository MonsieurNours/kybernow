# Publie l'image Docker du relais de KyberNow (server/relay) sur GitHub
# Container Registry à chaque version : ghcr.io/monsieurnours/kybernow-relay,
# étiquetée X.Y.Z et, pour une version stable, latest. Les relais installés avec
# le docker-compose.yml du dépôt la reprennent d'eux-mêmes chaque nuit (service
# « updater ») ou par `docker compose pull && docker compose up -d`.
# Voir server/relay/README.md, « Mettre à jour ».
#
# Les essais du relais (cargo test de server/relay et de son tunnel) passent
# avant toute image : une régression ne part pas en production, où les relais
# se mettent à jour d'eux-mêmes.
name: Image du relais

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (X.Y.Z, une étiquette vX.Y.Z existante)"
        required: true
      latest:
        description: "Étiqueter aussi latest"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: relay-image
  cancel-in-progress: false

jobs:
  # La version et son étiquette, validées avant tout : les entrées passent par
  # l'environnement, jamais dans le texte du script (pas d'injection).
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      tags: ${{ steps.v.outputs.tags }}
    steps:
      - name: Version
        id: v
        env:
          EVENEMENT: ${{ github.event_name }}
          TAG_RELEASE: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          VERSION_DEMANDEE: ${{ inputs.version }}
          LATEST_DEMANDE: ${{ inputs.latest }}
        run: |
          if [ "$EVENEMENT" = "release" ]; then
            tag="$TAG_RELEASE"
            latest=true
            [ "$PRERELEASE" = "true" ] && latest=false
          else
            tag="v$VERSION_DEMANDEE"
            latest="$LATEST_DEMANDE"
          fi
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version illisible : $tag" >&2; exit 1
          fi
          image="ghcr.io/monsieurnours/kybernow-relay"
          tags="$image:$version"
          [ "$latest" = "true" ] && tags="$tags,$image:latest"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

  tests:
    name: Essais du relais
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/relay
      - name: cargo test (relais et tunnel)
        working-directory: server/relay
        run: cargo test --locked --workspace

  image:
    name: Construire et publier
    needs: [version, tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: server/relay
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.version.outputs.tags }}
          labels: |
            org.opencontainers.image.title=KyberNow relay
            org.opencontainers.image.description=Relais de KyberNow (KyberNow Share, accès hors de chez soi)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
