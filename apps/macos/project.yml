# Projet Xcode de l'app KyberNow pour macOS (généré par XcodeGen :
# `xcodegen generate`). Avant le premier build : scripts/vendor-kyber.sh puis
# scripts/build-kyclient.sh (libkyclient avec les correctifs KyberNow).
name: KyberNow
options:
  bundleIdPrefix: fr.leslignesclaires
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "202610201136"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # Certificat de développement des Lignes Claires : une signature stable
    # d'une compilation à l'autre, sans quoi le Trousseau redemande l'accès au
    # mot de passe à chaque nouvelle version. Developer ID pour la distribution.
    CODE_SIGN_IDENTITY: "Apple Development: info@leslignesclaires.fr (FSBFCDSH25)"
    DEVELOPMENT_TEAM: P6DB682S4K
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
packages:
  # Mises à jour de l'app : flux appcast.xml publié avec chaque version sur GitHub.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  KyberKit:
    type: framework
    platform: macOS
    sources:
      - path: KyberKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.leslignesclaires.KyberKit
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/Frameworks
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../../.."
        SKIP_INSTALL: YES
  KyberNow:
    type: application
    platform: macOS
    sources:
      - path: KyberNow
    dependencies:
      - target: KyberKit
        embed: true
      - package: Sparkle
    # Complète l'Info.plist généré : lien kybernow:// et service Bonjour.
    info:
      path: KyberNow/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: fr.leslignesclaires.kybernow.pairing
            CFBundleURLSchemes: [kybernow]
        NSBonjourServices: [_kybernow._tcp]
        # Sparkle : dernière version publiée, signature EdDSA vérifiée avec cette clé.
        SUFeedURL: https://github.com/MonsieurNours/kybernow/releases/latest/download/appcast.xml
        SUPublicEDKey: BRT7PuVvNR6zfm4Rpn9QWxgLUUn8mE8aaDLDXBg1Po4=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.leslignesclaires.kybernow
        PRODUCT_NAME: KyberNow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KyberNow
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Les Lignes Claires · AGPL-3.0"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "KyberNow se connecte à vos ordinateurs sur le réseau local."
        INFOPLIST_KEY_NSCameraUsageDescription: "KyberNow lit le QR code affiché par la console de votre ordinateur."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/Frameworks
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    postBuildScripts:
      - name: Bibliothèques Kyber et plugins VLC
        script: '"$SRCROOT/scripts/embed-kyber.sh"'
        basedOnDependencyAnalysis: false
