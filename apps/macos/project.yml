# Projet Xcode de l'app KyberNow Link pour macOS (généré par XcodeGen :
# `xcodegen generate`). Avant le premier build : scripts/vendor-kyber.sh,
# scripts/build-kyclient.sh (libkyclient avec les correctifs KyberNow), puis
# ../apple/scripts/build-apple.sh (le cœur Rust, libkybernow).
name: KyberNow
options:
  bundleIdPrefix: fr.leslignesclaires
  deploymentTarget:
    macOS: "14.0"
  # Anglais : langue de repli de toute langue non traduite (docs/i18n.md) ;
  # les catalogues de chaînes (Localizable.xcstrings) ont le français pour source.
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Chaînes de l'interface extraites à la compilation vers les catalogues.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "202610281245"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # Certificat de développement des Lignes Claires : une signature stable
    # d'une compilation à l'autre, sans quoi le Trousseau redemande l'accès au
    # mot de passe à chaque nouvelle version. Developer ID pour la distribution.
    CODE_SIGN_IDENTITY: "Apple Development: info@leslignesclaires.fr (FSBFCDSH25)"
    DEVELOPMENT_TEAM: P6DB682S4K
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    # Version diffusée : Developer ID, runtime renforcé, horodatage sécurisé
    # (exigés par la notarisation d'Apple, voir scripts/release.sh).
    Release:
      CODE_SIGN_IDENTITY: "Developer ID Application: Mathieu Requenna (P6DB682S4K)"
      ENABLE_HARDENED_RUNTIME: YES
      OTHER_CODE_SIGN_FLAGS: "--timestamp"
      # Pas d'autorisation de débogage (get-task-allow) : refusée par la notarisation.
      CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
packages:
  # Mises à jour de l'app : flux cumulatif du site, archives publiées avec chaque version sur GitHub.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  KyberKit:
    type: framework
    platform: macOS
    sources:
      # La session, la console, la latence, les entrées et le son sont dans
      # le cœur Rust (apps/core, pont apps/apple : docs/coeur-apple.md).
      - path: KyberKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.leslignesclaires.KyberKit
        GENERATE_INFOPLIST_FILE: YES
        # Vendor/KyberNow : en-tête du cœur (CKyberNow), produit par apps/apple/scripts/build-apple.sh.
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/include $(SRCROOT)/Vendor/KyberNow/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/Frameworks
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../../.."
        SKIP_INSTALL: YES
  KyberNow:
    type: application
    platform: macOS
    sources:
      - path: KyberNow
    dependencies:
      - target: KyberKit
        embed: true
      - package: Sparkle
    # Complète l'Info.plist généré : lien kybernow:// et service Bonjour.
    info:
      path: KyberNow/Info.plist
      properties:
        # Nom de l'app dans la barre des menus : Xcode (GENERATE_INFOPLIST_FILE)
        # le remplace par PRODUCT_NAME ; le catalogue InfoPlist.xcstrings
        # (CFBundleName, en et fr) le porte aussi.
        CFBundleName: KyberNow Link
        CFBundleURLTypes:
          - CFBundleURLName: fr.leslignesclaires.kybernow.pairing
            CFBundleURLSchemes: [kybernow]
        NSBonjourServices: [_kybernow._tcp]
        # Sparkle : flux cumulatif du site (site/updates/appcast.xml, stables et
        # bêtas, voir docs/releases.md) ; archives vérifiées avec cette clé.
        SUFeedURL: https://www.kybernow.app/updates/appcast.xml
        SUPublicEDKey: BRT7PuVvNR6zfm4Rpn9QWxgLUUn8mE8aaDLDXBg1Po4=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.leslignesclaires.kybernow
        # Paquet « KyberNow Link.app » ; le module Swift garde le nom KyberNow.
        PRODUCT_NAME: KyberNow Link
        PRODUCT_MODULE_NAME: KyberNow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KyberNow Link
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Les Lignes Claires · AGPL-3.0"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "KyberNow Link se connecte à vos ordinateurs sur le réseau local."
        INFOPLIST_KEY_NSCameraUsageDescription: "KyberNow Link lit le QR code affiché dans KyberNow Admin."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/Frameworks
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        # iCloud (ordinateurs publiés pour l'Apple TV) : droits qui exigent un
        # profil de provisionnement (README, « Signature et iCloud »).
        CODE_SIGN_ENTITLEMENTS: KyberNow/KyberNow.entitlements
      configs:
        # Profil « macOS App Development » : ce Mac, certificat de développement.
        Debug:
          PROVISIONING_PROFILE_SPECIFIER: fr.leslignesclaires.kybernow
        # Profil « Developer ID » : tous les Mac, version notarisée.
        Release:
          PROVISIONING_PROFILE_SPECIFIER: P6DB682S4K.fr.leslignesclaires.kybernow
    postBuildScripts:
      - name: Bibliothèques Kyber et plugins VLC
        script: '"$SRCROOT/scripts/embed-kyber.sh"'
        basedOnDependencyAnalysis: false
