# Projet Xcode de l'app KyberNow pour macOS (généré par XcodeGen :
# `xcodegen generate`). Avant le premier build : scripts/vendor-kyber.sh.
name: KyberNow
options:
  bundleIdPrefix: fr.leslignesclaires
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: fr
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    # Signature locale pour le développement ; Developer ID pour la distribution.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: NO
    DEAD_CODE_STRIPPING: YES
targets:
  KyberKit:
    type: framework
    platform: macOS
    sources:
      - path: KyberKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.leslignesclaires.KyberKit
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/Frameworks
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks @loader_path/../../.."
        SKIP_INSTALL: YES
  KyberNow:
    type: application
    platform: macOS
    sources:
      - path: KyberNow
    dependencies:
      - target: KyberKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.leslignesclaires.kybernow
        PRODUCT_NAME: KyberNow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: KyberNow
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Les Lignes Claires · AGPL-3.0"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "KyberNow se connecte à vos ordinateurs sur le réseau local."
        INFOPLIST_KEY_NSCameraUsageDescription: "KyberNow lit le QR code affiché par la console de votre ordinateur."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/Frameworks
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
    postBuildScripts:
      - name: Bibliothèques Kyber et plugins VLC
        script: '"$SRCROOT/scripts/embed-kyber.sh"'
        basedOnDependencyAnalysis: false
