# Clients KyberNow écrits en Rust : le cœur partagé (core), les apps Windows,
# webOS et Linux, le pont C des apps Apple (apple, voir docs/coeur-apple.md)
# et le pont JNI de l'app Android (android/jni).
#
# Les briques de Kyber 0.29 viennent de third_party/kyber-desktop/kysdk, avec
# les correctifs KyberNow des apps (apps/macos/kyber-patches) : voir
# apps/windows/README.md.

[workspace]
resolver = "3"
members = ["core", "windows", "apple", "android/jni", "webos", "linux"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.89"

# Les crates de Kyber se nomment entre elles par leur version crates.io : on
# les ramène aux sources locales, comme kysdk/.cargo/config.toml.
[patch.crates-io]
kycom = { path = "../third_party/kyber-desktop/kysdk/kymux/kycom" }
kymux = { path = "../third_party/kyber-desktop/kysdk/kymux/kymux" }
kyaudioreg = { path = "../third_party/kyber-desktop/kysdk/kymedia/kyaudioreg" }
kynput = { path = "../third_party/kyber-desktop/kysdk/kynput/kynput" }
kynput-rs = { path = "../third_party/kyber-desktop/kysdk/kynput/kynput-rs" }
kynput-sys = { path = "../third_party/kyber-desktop/kysdk/kynput/kynput-rs/kynput-sys" }
vlc-rs = { path = "../third_party/kyber-desktop/kysdk/kymedia/subprojects/vlc-rs" }

[profile.release]
debug = 1
strip = false
