# Projet Xcode de l'app KyberNow Link pour l'Apple TV (généré par XcodeGen :
# `xcodegen generate`). Avant le premier build : scripts/build-kyber-tvos.sh
# (SDK client de Kyber compilé pour tvOS, dans Vendor/), puis
# ../apple/scripts/build-apple-mobile.sh tvos (le cœur Rust, KyberNow.xcframework).
#
# KyberKit est le même module que sur Mac : ses fichiers communs viennent
# d'apps/macos/KyberKit (seuls les fichiers AppKit du Mac sont exclus
# ci-dessous ; les entrées, le son et la session sont dans le cœur Rust,
# docs/coeur-apple.md), la vue de session
# et les entrées propres à tvOS de KyberKitTV. Le modèle (ordinateurs,
# réglages) et la découverte Bonjour viennent aussi de l'app Mac.
name: KyberNowTV
options:
  bundleIdPrefix: fr.leslignesclaires
  deploymentTarget:
    tvOS: "18.0"
  # Anglais : langue de repli de toute langue non traduite (docs/i18n.md) ;
  # les catalogues de chaînes (Localizable.xcstrings) ont le français pour source.
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Chaînes de l'interface extraites à la compilation vers les catalogues.
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "0.7.0"
    CURRENT_PROJECT_VERSION: "202610271026"
    TARGETED_DEVICE_FAMILY: "3"
    DEVELOPMENT_TEAM: P6DB682S4K
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES
    # Le SDK de Kyber n'est compilé que pour arm64 (Apple TV et simulateur sur Mac Apple).
    ARCHS: arm64
    EXCLUDED_ARCHS[sdk=appletvsimulator*]: x86_64
targets:
  KyberKit:
    type: framework
    platform: tvOS
    sources:
      - path: ../macos/KyberKit
        excludes:
          - KeymapMac.swift
          - MetalSurface.swift
          - RelativeMouse.swift
          - StreamView.swift
      - path: KyberKitTV
    dependencies:
      # Le cœur Rust et son pont C (apps/apple/scripts/build-apple-mobile.sh tvos).
      - framework: Vendor/KyberNow.xcframework
        embed: false
      # libkynput (API C de la chaîne d'entrées), libopus et les fonctions
      # vides de VLC (apps/tvos/scripts/build-kyber-tvos.sh).
      - framework: Vendor/KyberSDK.xcframework
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libiconv.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.leslignesclaires.KyberKit
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Vendor/include $(SRCROOT)/Vendor/KyberNow/include
        SKIP_INSTALL: YES
        # Les bibliothèques Rust embarquent chacune leur bibliothèque standard.
        OTHER_LDFLAGS: -Wl,-dead_strip
  KyberNowTV:
    type: application
    platform: tvOS
    sources:
      - path: KyberNowTV
      - path: ../macos/KyberNow/Model.swift
      - path: ../macos/KyberNow/Discovery.swift
      - path: ../macos/KyberNow/LinkUI.swift
      - path: ../macos/KyberNow/Share.swift
      - path: ../macos/KyberNow/Fonts
        buildPhase: resources
    dependencies:
      - target: KyberKit
        embed: true
      - target: KyberNowTopShelf
        embed: true
    info:
      path: KyberNowTV/Info.plist
      properties:
        # Versions du projet (alignées par scripts/release.sh), pas le 1.0 d'xcodegen.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: KyberNow
        CFBundleURLTypes:
          - CFBundleURLName: fr.leslignesclaires.kybernow.tv
            CFBundleURLSchemes: [kybernow-tv]
        NSBonjourServices: [_kybernow._tcp]
        NSLocalNetworkUsageDescription: KyberNow Link trouve vos ordinateurs sur ce réseau et s'y connecte.
        UIUserInterfaceStyle: Dark
        UIRequiredDeviceCapabilities: [arm64]
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    entitlements:
      path: KyberNowTV/KyberNowTV.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.leslignesclaires.kybernow]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)fr.leslignesclaires.kybernow
        keychain-access-groups: [$(AppIdentifierPrefix)fr.leslignesclaires.kybernow]
        com.apple.developer.user-management: [runs-as-current-user]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.leslignesclaires.kybernow
        PRODUCT_NAME: KyberNow
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
  KyberNowTopShelf:
    type: tv-app-extension
    platform: tvOS
    sources:
      - path: TopShelf
      - path: KyberNowTV/Shared/TopShelfStore.swift
    dependencies:
      - sdk: TVServices.framework
    info:
      path: TopShelf/Info.plist
      properties:
        # Versions du projet (alignées par scripts/release.sh), pas le 1.0 d'xcodegen.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: KyberNow
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    entitlements:
      path: TopShelf/TopShelf.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.leslignesclaires.kybernow]
        com.apple.developer.user-management: [runs-as-current-user]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.leslignesclaires.kybernow.topshelf
        PRODUCT_NAME: KyberNowTopShelf
  # Parcours à la télécommande (XCUIRemote) : focus et formulaires.
  KyberNowTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [UITests]
    dependencies:
      - target: KyberNowTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.leslignesclaires.kybernow.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  KyberNowTV:
    build:
      targets:
        KyberNowTV: all
    run:
      config: Debug
    test:
      targets: [KyberNowTVUITests]
