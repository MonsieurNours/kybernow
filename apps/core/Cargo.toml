[package]
name = "kybernow-core"
description = "Cœur des apps KyberNow Link : Admin, session Kyber, profils, latence, entrées, son"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
kyclient = { path = "../../third_party/kyber-desktop/kysdk/kyctl/kyclient", features = ["kymux"] }
kyclient-common = { path = "../../third_party/kyber-desktop/kysdk/kyctl/kyclient-common" }
kyvlcplayer = { path = "../../third_party/kyber-desktop/kysdk/kyctl/kyvlcplayer" }
kynput-rs = "0.1.0"
kynput-sys = "0.1.0"
base64 = "0.22"
log = "0.4"
rustls = { version = "0.23.31", default-features = false, features = ["logging", "ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
getrandom = "0.2"
# Relais (docs/relais.md) : le tunnel commun du relais, d'Admin et des apps,
# tokio pour son runtime (deux fils, créés par le cœur).
kybernow-tunnel = { path = "../../server/relay/tunnel" }
tokio = { version = "1.43", features = ["rt-multi-thread", "time", "sync", "net"] }
minisign-verify = "0.3"

[features]
# Lecteur de manettes par SDL dans le cœur (`gamepads::start_sdl`) : apps Mac
# (pont apps/apple sur macOS) et Windows, dont libkynput est construite sans
# son propre lecteur SDL. SDL2 est trouvée par pkg-config (build.rs), sinon
# l'exécutable final la lie lui-même.
sdl = []

# Essais du relais sur la boucle locale (faux relais, faux Admin).
[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
ring = "0.17"

[build-dependencies]
pkg-config = "0.3"
