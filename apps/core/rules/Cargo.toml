[package]
name = "kybernow-rules"
description = "Règles pures des apps KyberNow Link (adresses, empreintes, codes, relais, bornes et valeurs communes, courbes HDR), sans aucune dépendance"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Aucune dépendance par défaut : la caisse se compile partout (cœur, interfaces
# Linux et LG sans le cœur, Admin plus tard) ; chaque module ne nomme que
# `super::` et std. `serde` (facultatif) : le JSON de l'état de l'accueil
# (`welcome::WelcomeState`), que les apps gardent.
[dependencies]
serde = { version = "1", features = ["derive"], optional = true }

[features]
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"
