[package]
name = "kybernow-android"
description = "Pont JNI du cœur KyberNow pour l'app Android (téléphone, tablette, téléviseur)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "kybernow"
crate-type = ["cdylib", "rlib"]

[features]
# Décodage PyroWave par Vulkan (docs/pyrowave-client-android.md) : lie
# libkybernow_pyrowave.so, construite par apps/android/scripts/build-native.sh
# (arm64-v8a et x86_64) dans le dossier de KYBERNOW_PYROWAVE_LIB. Sans elle,
# la sonde répond « indisponible ».
pyrowave = []
# Kyber sait demander PyroWave (correctif kyclient 0025 posé) : la
# fonctionnalité `pyrowave` du cœur (build-native.sh --kyber-pyrowave).
kyber-pyrowave = ["kybernow-core/pyrowave"]

[dependencies]
kybernow-core = { path = "../../core" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk = { version = "0.9", features = ["media", "audio", "api-level-30"] }
android_logger = "0.15"

[build-dependencies]
cc = "1"
pkg-config = "0.3"
