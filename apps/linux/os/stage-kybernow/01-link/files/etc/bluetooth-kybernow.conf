# KyberNow Link OS : les manettes s'associent sans code (l'app pose un agent
# NoInputNoOutput pendant l'écran « Manette » et Réglages › Manettes). Une
# manette déjà connue qui demande à se réassocier (clés perdues) le fait
# seulement pendant cet écran : l'agent de l'app confirme, sinon personne ne
# répond et c'est refusé. Un appareil qui prendrait l'adresse d'une manette
# connue ne se réassocie donc pas en silence (audit LINAPP-29). Une manette
# associée qui se reconnecte, elle, n'est pas concernée.
[General]
JustWorksRepairing = confirm
FastConnectable = true
ControllerMode = dual
Name = KyberNow Link

[Policy]
AutoEnable = true
ReconnectAttempts = 7
