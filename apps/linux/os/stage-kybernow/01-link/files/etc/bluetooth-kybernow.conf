# KyberNow Link OS : les manettes s'associent sans code (l'app pose un agent
# NoInputNoOutput pendant l'écran « Manette » et Réglages › Manettes), et une
# manette déjà connue se réassocie sans question.
[General]
JustWorksRepairing = always
FastConnectable = true
ControllerMode = dual
Name = KyberNow Link

[Policy]
AutoEnable = true
ReconnectAttempts = 7
