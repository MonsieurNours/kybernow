# KyberNow Link OS : SSH par clé seulement, compte kybernow. Les clés et la clé
# d'hôte vivent sur la partition de données (/var/lib/kybernow/ssh), que les
# mises à jour A/B ne réécrivent pas : une clé posée reste, et l'appareil garde
# son identité d'une version à l'autre. Une clé s'ajoute sans SSH en déposant
# kybernow-ssh.pub (ou authorized_keys) sur la partition de démarrage depuis un
# ordinateur : kybernow-os-ctl ssh-keys l'importe au démarrage, puis l'efface.
# Inclus en tête de sshd_config : ces valeurs l'emportent (la première lue gagne).
# ~/.ssh/authorized_keys reste lu (émulation, emulate.sh), mais n'est pas gardé
# par les mises à jour. La clé d'hôte du système sert seulement si celle des
# données manque (partition absente) : sshd prend la première de chaque type.
AuthorizedKeysFile /var/lib/kybernow/ssh/%u/authorized_keys .ssh/authorized_keys
HostKey /var/lib/kybernow/ssh/ssh_host_ed25519_key
HostKey /etc/ssh/ssh_host_ed25519_key
PasswordAuthentication no
# Le compte kybernow a un mot de passe verrouillé (passwd -l) : sans PAM, sshd
# refuserait aussi la clé ; avec (le défaut de Debian, redit ici), la clé suffit.
UsePAM yes
KbdInteractiveAuthentication no
PermitRootLogin no
