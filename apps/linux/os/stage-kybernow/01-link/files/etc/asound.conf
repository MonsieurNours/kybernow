# KyberNow Link OS : le son sort sur la première prise HDMI de la puce
# (carte vc4hdmi0 ; vc4hdmi1 sur l'autre prise des Pi 4 et 5), avec la
# configuration de la carte (plugin IEC958 : stéréo et PCM multicanal).
pcm.!default {
    type plug
    slave.pcm "sysdefault:CARD=vc4hdmi0"
}
ctl.!default {
    type hw
    card vc4hdmi0
}
